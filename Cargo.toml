[package]
name = "orbit"
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.85"
authors = ["Shane Wall <shaneawall@gmail.com>"]
description = "A trustworthy local data copier"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/saworbit/orbit"

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
